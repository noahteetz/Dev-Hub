name: CI

on:
  push:
    branches: [main, shared-projects, remote-workspaces]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Test and build
        working-directory: backend
        run: ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/build/libs/*SNAPSHOT.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  runner:
    needs: backend
    name: Runner tests and images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, check and test runner
        working-directory: runner
        run: |
          npm ci
          npm run lint
          npm test
      - name: Build runner image
        run: docker build -t devhub-runner:ci runner
      - name: Build workspace image
        run: docker build -t devhub-workspace:ci runner/workspace
      - name: Build egress proxy image
        run: docker build -t devhub-egress:ci runner/egress
      - name: Test real Docker workspaces
        run: |
          docker run -d --name devhub-ci-proxy devhub-egress:ci
          sudo env PATH="$PATH" node --test runner/test/docker.integration.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend-ci
      - name: Validate Compose and nginx configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          DEVHUB_ENCRYPTION_KEY: dGVzdC1vbmx5LWtleS1mb3ItZGV2aHViLTMyLWJ5dGU=
        run: |
          docker compose config --quiet
          docker compose -f deploy/docker-compose.yml config --quiet
          docker run --rm --add-host backend:127.0.0.1 -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
      - name: Start PostgreSQL and backend for end-to-end test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:15432/devhub
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: ci-only-password
          DEVHUB_AUTH_ENABLED: "false"
          DEVHUB_WORKSPACE_ENABLED: "true"
          DEVHUB_RUNNER_URL: http://localhost:18090
          DEVHUB_RUNNER_TOKEN: test-only-runner-token-at-least-32-characters
          DEVHUB_REPOSITORY_SYNC_ENABLED: "false"
        run: |
          docker run -d --name devhub-ci-postgres -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=devhub -p 15432:5432 postgres:18-alpine
          for attempt in $(seq 1 30); do
            if docker exec devhub-ci-postgres pg_isready -U postgres -d devhub; then break; fi
            sleep 1
          done
          java -jar backend-ci/backend-0.0.1-SNAPSHOT.jar --server.port=18080 > /tmp/devhub-backend-ci.log 2>&1 &
      - name: Test complete HTTP and WebSocket path
        run: sudo env PATH="$PATH" node --test runner/test/e2e.integration.mjs
      - name: Proxy diagnostics
        if: failure()
        run: |
          docker inspect devhub-ci-proxy --format '{{.State.Status}} {{.State.Error}}'
          docker logs --tail 60 devhub-ci-proxy
      - name: Backend diagnostics
        if: failure()
        run: tail -n 100 /tmp/devhub-backend-ci.log 2>/dev/null || true
