spring.application.name=backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/devhub}
spring.datasource.username=${DATABASE_USERNAME:devhub}
spring.datasource.password=${DATABASE_PASSWORD:devhub}

management.endpoint.health.probes.enabled=true
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# Keycloak `sub` of the account that owns all data created before multi-user support.
# Read once by the V6 migration; `local` is the user of a run without a login.
spring.flyway.placeholders.legacyOwnerSubject=${DEVHUB_LEGACY_OWNER_SUBJECT:local}
devhub.repository.connect-timeout=${DEVHUB_REPOSITORY_CONNECT_TIMEOUT:3s}
devhub.repository.read-timeout=${DEVHUB_REPOSITORY_READ_TIMEOUT:10s}
devhub.repository.github.base-url=${DEVHUB_REPOSITORY_GITHUB_BASE_URL:https://api.github.com}
devhub.repository.gitlab.base-url=${DEVHUB_REPOSITORY_GITLAB_BASE_URL:https://gitlab.com/api/v4}
devhub.stale-project-days=${DEVHUB_STALE_PROJECT_DAYS:30}
devhub.security.encryption-key=${DEVHUB_ENCRYPTION_KEY:}
devhub.repository.discovery.cache-ttl=${DEVHUB_REPOSITORY_DISCOVERY_CACHE_TTL:5m}

# Hourly background sync of every project repository, so the dashboard order and the
# repository panel stay current without a manual refresh. A repository that did not
# change answers with 304, which costs one request and none of the GitHub quota.
devhub.repository.sync.enabled=${DEVHUB_REPOSITORY_SYNC_ENABLED:true}
devhub.repository.sync.interval=${DEVHUB_REPOSITORY_SYNC_INTERVAL:1h}
devhub.repository.sync.initial-delay=${DEVHUB_REPOSITORY_SYNC_INITIAL_DELAY:2m}
devhub.repository.sync.request-spacing=${DEVHUB_REPOSITORY_SYNC_REQUEST_SPACING:1s}

# Keycloak. Enabled by default so a deployment cannot accidentally serve the API
# without a login; local runs and the test suite set DEVHUB_AUTH_ENABLED=false.
devhub.auth.enabled=${DEVHUB_AUTH_ENABLED:true}
devhub.auth.issuer-uri=${DEVHUB_AUTH_ISSUER_URI:}
devhub.auth.internal-issuer-uri=${DEVHUB_AUTH_INTERNAL_ISSUER_URI:}
devhub.auth.jwk-set-uri=${DEVHUB_AUTH_JWK_SET_URI:}
devhub.auth.client-id=${DEVHUB_AUTH_CLIENT_ID:dev-hub-frontend}
devhub.auth.audience=${DEVHUB_AUTH_AUDIENCE:dev-hub-backend}
devhub.auth.required-role=${DEVHUB_AUTH_REQUIRED_ROLE:devhub-user}
devhub.auth.scope=${DEVHUB_AUTH_SCOPE:openid profile email}
