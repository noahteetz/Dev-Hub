spring.datasource.url=jdbc:h2:mem:devhub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# A throwaway 32 byte key so the credential tests exercise the real encryption path.
devhub.security.encryption-key=dGVzdC1vbmx5LWtleS1mb3ItZGV2aHViLTMyLWJ5dGU=
devhub.repository.discovery.cache-ttl=5m
# The suite exercises the API itself, not the login in front of it; the login is
# covered separately by SecurityIntegrationTests, which switches it back on.
devhub.auth.enabled=false
