services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devhub}
      POSTGRES_USER: ${POSTGRES_USER:-devhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-devhub}
      DATABASE_USERNAME: ${POSTGRES_USER:-devhub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-devhub}
      DEVHUB_ENCRYPTION_KEY: ${DEVHUB_ENCRYPTION_KEY:-}
      # Local runs default to no login so the stack comes up without a Keycloak.
      # This file is for development only — the deployed stack in deploy/ keeps
      # the login on, and nothing here should ever be copied onto a server.
      DEVHUB_AUTH_ENABLED: ${DEVHUB_AUTH_ENABLED:-false}
      DEVHUB_AUTH_ISSUER_URI: ${DEVHUB_AUTH_ISSUER_URI:-}
      DEVHUB_AUTH_CLIENT_ID: ${DEVHUB_AUTH_CLIENT_ID:-dev-hub-frontend}
      DEVHUB_AUTH_AUDIENCE: ${DEVHUB_AUTH_AUDIENCE:-dev-hub-backend}
      DEVHUB_AUTH_REQUIRED_ROLE: ${DEVHUB_AUTH_REQUIRED_ROLE:-devhub-user}
      DEVHUB_WORKSPACE_ENABLED: ${DEVHUB_WORKSPACE_ENABLED:-false}
      WORKSPACE_MAX_RUNNING_PER_USER: ${WORKSPACE_MAX_RUNNING_PER_USER:-2}
      WORKSPACE_MAX_PER_USER: ${WORKSPACE_MAX_PER_USER:-3}
      DEVHUB_RUNNER_URL: http://runner:8090
      DEVHUB_RUNNER_TOKEN: ${DEVHUB_RUNNER_TOKEN:-}
      DEVHUB_WORKSPACE_ORIGINS: ${DEVHUB_WORKSPACE_ORIGINS:-http://localhost:5173}
    networks: [default, workspace-control]
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  runner:
    build: ./runner
    image: devhub-runner:local
    profiles: [workspaces]
    restart: unless-stopped
    environment:
      DEVHUB_RUNNER_TOKEN: ${DEVHUB_RUNNER_TOKEN:-}
      DEVHUB_BACKEND_URL: http://backend:8080
      WORKSPACE_IMAGE: devhub-workspace:local
      RUNNER_BROKER_DIR: /run/dev-hub-brokers
      WORKSPACE_MAX_RUNNING: ${WORKSPACE_MAX_RUNNING:-2}
      WORKSPACE_MAX_RUNNING_PER_USER: ${WORKSPACE_MAX_RUNNING_PER_USER:-2}
      WORKSPACE_CPUS: ${WORKSPACE_CPUS:-2}
      WORKSPACE_MEMORY_BYTES: ${WORKSPACE_MEMORY_BYTES:-4294967296}
      WORKSPACE_PIDS: ${WORKSPACE_PIDS:-1024}
      WORKSPACE_DISK_BYTES: ${WORKSPACE_DISK_BYTES:-5368709120}
      RUNNER_MIN_FREE_BYTES: ${RUNNER_MIN_FREE_BYTES:-10737418240}
      WORKSPACE_IDLE_SECONDS: ${WORKSPACE_IDLE_SECONDS:-1800}
      WORKSPACE_MAX_RUNTIME_SECONDS: ${WORKSPACE_MAX_RUNTIME_SECONDS:-14400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/dev-hub-brokers:/run/dev-hub-brokers
      - runner-state:/data
    networks: [workspace-control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      workspace-image:
        condition: service_completed_successfully
      workspace-egress:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  workspace-image:
    build: ./runner/workspace
    image: devhub-workspace:local
    profiles: [workspaces]
    command: ["true"]
    network_mode: none

  workspace-egress:
    build: ./runner/egress
    image: devhub-egress:local
    container_name: dev-hub-workspace-egress
    profiles: [workspaces]
    restart: unless-stopped
    networks: [workspace-egress-public]
    security_opt: [no-new-privileges:true]

networks:
  workspace-control:
    internal: true
  workspace-egress-public:

volumes:
  runner-state:
  postgres-data: